name: Relatar um problema
description: Informe um comportamento inesperado do aplicativo.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Explique o problema e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra...
        2. Selecione...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Sistema e Python
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remova caminhos pessoais e dados sensíveis antes de enviar.
      render: shell
